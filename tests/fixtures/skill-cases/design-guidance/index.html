<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учебная карточка заказа</title>
  <style>
    :root { --text: #172535; --canvas: #ffffff; --hint: #465b70; --muted: #566b79; }
    body { background: var(--canvas); color: var(--text); font: 1rem system-ui; margin: 2rem; }
    .hint { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Заказ на перевод</h1>
  <p class="hint">Подтверждение ещё не получено.</p>
  <button>Сменить исполнителя</button>
</body>
</html>
