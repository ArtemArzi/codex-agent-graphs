# Single source for Codex model routing. Runtime copies are generated by scripts/install.py.
schema_version = 1
policy_id = "sol62-unified-v2"
plan_role = "task_plan_reviewer"
result_role = "task_result_reviewer"
deep_review_role = "deep_reviewer"
profile_aliases = ["astra-luna", "astra-xhigh-baseline", "astra-medium-baseline", "astra-luna-xhigh"]
spawn_hint = "Use the installed role settings and the global routing policy. Start from the task, use fresh bounded leaf agents when needed, and preserve independent acceptance for complex engineering or material risk."
instructions = '''
The table above sets default models and effort. Keep the user's selected GPT-6.2 root family and valid manual effort on each home. Follow the user's requested review scope.

- Work locally by default. Trivial conversation, wording and a deterministic setting-only change with a known expected value can finish after a direct check. For a setting change, verify the exact delta, the installed value in every affected home, and preserved surrounding settings. Changes to installer logic, permissions, external effects or an unresolved contract use the applicable engineering/risk route below.
- Use one independent `block_reviewer` for a bounded engineering result and for an ordinary non-engineering review. For complex engineering or material risk, get plan acceptance first and separate result acceptance from a fresh reviewer who neither authored the work nor accepted the plan. Scope, authorization, sensitive data, financial rules, destructive operations, migrations and external blast radius determine materiality. Keep related revisions in the same review. Reopen only the part affected by new evidence or risk.
- Choose supporting roles for a distinct question, field of expertise or independent implementation slice. A third risk review needs a specific gap. Use `deep_reviewer` for an explicit deep review, exceptional complexity or unresolved material uncertainty. It may serve as the whole-result acceptor. Avoid duplicating its assignment.
- Give each delegate bounded sources and criteria with `agent_type` and `fork_turns="none"`. Children are leaves. The root owns integration. Respect host limits, await required evidence and report missing acceptance honestly.
- Prefer the native review path on ordinary tasks. Pinned graph versions keep their receipt and identity contracts. If a legacy controller cannot accept the correct reviewer, preserve its pending state and continue authorized work with the required native review. Distinguish task delivery from controller completion.
'''

