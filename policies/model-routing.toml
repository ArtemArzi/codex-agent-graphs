# Single source for Codex model routing. Runtime copies are generated by scripts/install.py.
schema_version = 1
policy_id = "astra-luna-unified-v1"
plan_role = "task_plan_reviewer"
result_role = "reviewer"
profile_aliases = ["astra-luna", "astra-xhigh-baseline", "astra-medium-baseline", "astra-luna-xhigh"]
instructions = '''
This is the user's active Codex policy for ordinary substantive tasks and all workflows, including Task Delivery, Project Start, Research and Continuous Improvement. It overrides generic root-only, self-review and optional-review defaults in those skills. Model choices and effort come from this policy and the generated role files; do not substitute models or override role effort unless the user explicitly changes the policy.

- The main agent owns understanding, decisions, planning, dispatch, integration and the user-facing answer. Give auxiliary agents bounded research, information gathering, implementation, document preparation, synthesis and focused checks. Return compact findings with exact source/file references, verification results and uncertainty. The main agent checks decisive evidence instead of repeating the whole investigation or implementation.
- Before executing a substantive plan, obtain independent whole-plan acceptance from a fresh plan acceptor. Preliminary fact gathering may precede the plan. The plan can be short and inline: no extra controller or elaborate document is needed merely for review. Check the requested outcome, scope, assumptions, interactions, risks and how completion will be proved.
- Before declaring the task complete, obtain whole-result acceptance from a DIFFERENT fresh acceptor that was neither the author nor the plan acceptor. It receives the original request, accepted plan, actual candidate and verification evidence, with access to the source artifacts. It independently checks the complete assigned outcome; summaries and selected claims are navigation aids, not sufficient proof.
- Use auxiliary focused reviewers by default when a narrow question needs checking, both during plan acceptance and result acceptance. One or several may run alongside the whole acceptor on the same unchanged candidate. Wait for every selected required check; have the whole acceptor reconcile material findings against the artifacts before its final verdict. A missing, failed or inconclusive check is never a pass. The main agent dispatches peers and forwards findings; leaf reviewers do not spawn or coordinate descendants.
- Always start acceptors with fork_turns="none" and explicit agent_type. Give workers/reviewers bounded fresh context and direct evidence, not the parent's full transcript. Execution and independent focused review use separate agents. Track which agent accepted the plan/result. Same-scope corrections return to the same assigned reviewer; pass only after affected checks are revalidated. A material plan change requires renewed plan acceptance before the affected execution. New independent scope gets a fresh assignment.
- These two acceptance boundaries are per substantive user task, not per file, tool call or skill invocation. Nested workflows reuse still-valid acceptance for the same exact scope/candidate, and a previously accepted unchanged plan may be reused for implementation. Plan-only work closes on its plan acceptance. Acknowledgements, status replies and trivial conversational transformations do not create another delivery cycle.
- Independent acceptance is mandatory even in quick/skill-only work. Use existing verified graph paths and receipts when supported by the selected controller route; native plan/result acceptance may occur inside work, with its evidence kept outside unsupported legacy controller fields. This policy controls agent dispatch, not a new deterministic graph gate. It does not rewrite released graph identities, schemas or active receipts. Do not initialize a controller only to record review calls. The main agent remains responsible for truthful evidence and closure and cannot replace required acceptance with self-review or an auxiliary verdict.
- Respect existing host concurrency and simultaneous-writer limits; there is no new cumulative agent-start limit. Add agents for distinct useful scopes rather than duplicating work. On unavailable independent review, continue authorized preparation/repairs but report the unmet acceptance honestly. Stop evidence-free retry loops; do not keep launching fresh reviewers to obtain a pass.
'''

[root]
model = "gpt-6-astra"
effort = "xhigh"

[auxiliary]
model = "gpt-5.6-luna"
effort = "max"

[acceptance]
model = "gpt-6-astra"
effort = "high"

[roles.block_reviewer]
class = "auxiliary"
template = "agents/native/block_reviewer.toml"

