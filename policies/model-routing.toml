# Single source for Codex model routing. Runtime copies are generated by scripts/install.py.
schema_version = 1
policy_id = "astra-luna-unified-v1"
plan_role = "task_plan_reviewer"
result_role = "reviewer"
profile_aliases = ["astra-luna", "astra-xhigh-baseline", "astra-medium-baseline", "astra-luna-xhigh"]
instructions = '''
This is the user's active Codex routing and delegation policy for all workflows, including Task Delivery, Project Start, Research and Continuous Improvement. Its task-size and risk threshold overrides blanket review/delegation requirements in skills, including quick and skill-only modes. Model choices and effort remain defined by this policy and the generated role files; do not substitute them without explicit user instruction.

- Default to root-only execution. The main agent may research, implement, test and document the whole task. Do known-context work directly when handing it off would cost as much as doing it.
- Trivial chat, wording/profile edits, short factual lookups and routine status/clarification answers stay root-only with proportionate verification. Simple, bounded engineering changes receive one independent result review through `block_reviewer` (auxiliary model); no whole-plan/whole-result acceptance pair is required. Implement locally unless an independent worker repays the handoff cost.
- Ordinary non-engineering reviews (texts, research reports, documents, presentations and plans) use `block_reviewer` (auxiliary model), including review of the complete bounded result. Non-engineering complexity, length, topic keywords, a plan heading, or the word "important" alone never selects an acceptance role. This routes reviews; it does not add a review to every trivial answer.
- Require a fresh whole-plan acceptor before execution and a DIFFERENT fresh whole-result acceptor before completion for complex engineering work (substantial architecture/cross-subsystem changes or material unresolved contracts) OR materially high-risk work in any domain. High risk means concrete consequences such as security/authorization changes, sensitive-data handling, financial business rules or substantial financial commitments, consequential legal/medical decisions, migrations, destructive operations, or production/external-state changes with meaningful blast radius. Mere discussion of these topics is not enough. Before choosing an acceptance role, briefly identify the concrete complexity or consequence in the dispatch; decide from the task, not keywords, and do not ask the user to classify routine cases. Do not split risky work into simple steps to bypass acceptance.
- Honor explicit requests for delegation or independent review at the requested scope. A request for one worker or one review of a simple task does not by itself require both plan and result acceptors. Explicitly requested deep/whole-plan-and-result review retains its stated coverage.
- Sequential refinements, related fields, routine corrections and follow-up questions within the same outcome remain one task. Do not restart plan/result review for each message. Reassess if intended outcome, affected contracts, scope or risk materially changes; obtain the newly required acceptance before dependent execution.
- Delegate an auxiliary block only when its independent scope, substantial work or distinct expertise is expected to repay startup, context transfer, waiting and integration. Keep small dependent steps together. Available roles, cheaper models and free slots are not reasons to spawn.
- Use `block_reviewer` for bounded reviews of individual blocks, components, contracts or risks, even inside a complex engineering task; the parent's complexity does not promote each child to an acceptance role. `reviewer` and workflow-specific acceptance roles are reserved for the complete outcome meeting the threshold above. A request for review alone does not select an acceptance model. Beyond the one result review for simple engineering, add focused reviewers only when an independent block or distinct material risk repays the handoff; ordinary narrow questions may stay with the root or assigned whole acceptor.
- When independent acceptance is required, the main agent cannot replace it with self-review or an auxiliary verdict. The whole-result acceptor must be neither author nor plan acceptor; it receives the original request, accepted plan, candidate and verification evidence with source access. Wait for every selected required check and reconcile material findings; missing, failed or inconclusive evidence is not a pass.
- Always set agent_type and fork_turns="none" when spawning; preserve configured roles and effort. Children are leaves. Give bounded fresh context, decisive source references, ownership and exclusions. Reuse a reviewer only for corrections to its assigned scope; revalidate affected checks after corrections. Do not repeat the entire investigation in the root.
- Acceptance boundaries belong to the complete user outcome, not each file, tool call, skill or internal step. Stage/skill switches, routine corrections and same-outcome refinements do not start a new acceptance pair. Reuse valid same-scope acceptance; send changed portions to the existing reviewer for targeted revalidation. Materially changed outcomes, contracts or risks require reassessing the affected review scope. Plan-only work requiring whole-plan acceptance closes on that acceptance. Simple engineering closes after proportionate local checks and its single auxiliary result review; ordinary non-engineering reviews close with the auxiliary verdict. Do not create a controller or receipt ceremony merely to record these reviews.
- Choose skill-only/native review for ordinary and simple work before admitting a controller. A released controller may require named acceptance-role receipts even below the current review threshold (for example low confidence or a previous rejection). This protocol condition does not promote the task to Astra. If no supported native-review completion route exists, stop/degrade controller execution, preserve its state and pending obligations, and continue authorized work with the required auxiliary review outside it. Record the incompatibility and native verdict in the existing handoff; never relabel a Sol receipt, change released schemas/identities, clear pending obligations, or claim that controller verification/completion passed. Distinguish task delivery from the unfinished controller. Real high-risk evidence still requires the normal whole-acceptance threshold.
- Respect host concurrency and writer limits; these are ceilings, not targets. Consider accumulated starts, waits and retries before adding another agent. On unavailable required independent review, continue safe authorized preparation but report the unmet check honestly. Stop evidence-free retries and duplicate assignments.
'''

[root]
model = "gpt-6-astra"
effort = "xhigh"

[auxiliary]
model = "gpt-6-sol"
effort = "medium"

[acceptance]
model = "gpt-6-astra"
effort = "medium"

[roles.block_reviewer]
class = "auxiliary"
template = "agents/native/block_reviewer.toml"

